version: '3.8'

services:
  # Backend Instance 1
  backend-1:
    build: ./src
    container_name: app-backend-1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP=APP1
    # Yahan container ke andar se hi check ho raha hai
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  # Backend Instance 2
  backend-2:
    build: ./src
    container_name: app-backend-2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP=APP2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  # Backend Instance 3
  backend-3:
    build: ./src
    container_name: app-backend-3
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP=APP3
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  # Backend Instance 4
  backend-4:
    build: ./src
    container_name: app-backend-4
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP=APP4
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  # NGINX Load Balancer
  nginx-lb:
    image: nginx:alpine
    container_name: nginx-load-balancer
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy # Yahan NGINX tabhi start hoga jab backends healthy ho jayenge!
      backend-2:
        condition: service_healthy
      backend-3:
        condition: service_healthy
      backend-4:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge